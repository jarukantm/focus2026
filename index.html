<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Leaderboard</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--blue:#1a6ff0; --green:#16a34a; --bg:#f2f7fd; --tx:#1f2a44;}
body{background:var(--bg); font-family:sans-serif; margin:0; padding:10px; color:var(--tx);}
.row{background:#fff; border-radius:15px; padding:15px; margin-bottom:10px; box-shadow:0 2px 5px rgba(0,0,0,0.05);}
.main{display:flex; align-items:center; gap:10px; cursor:pointer;}
.pts{font-weight:900; color:var(--blue); font-size:18px;}
.details{display:none; margin-top:15px; padding-top:15px; border-top:1px solid #eee;}
.dots{display:flex; gap:12px; margin-top:8px; margin-bottom:15px;}
.dot{width:16px; height:16px; border-radius:50%; border:2px solid var(--blue);}
.dot.on{background:var(--blue);}
.dot.green{border-color:var(--green);}
.dot.green.on{background:var(--green);}
.mask{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;padding:15px;z-index:999;}
.mask.on{display:flex;}
.modal{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:400px;}
input{width:100%;padding:12px;margin:8px 0 12px;border:1.5px solid #ddd;border-radius:10px;}
button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--blue);color:#fff;margin-top:5px;}
</style>
</head>
<body>

<div id="list"></div>

<div class="mask" id="mask">
  <div class="modal">
    <h3>ยืนยันตัวตน</h3>
    <label>ชื่อจริง *</label><input id="f_first">
    <label>นามสกุล *</label><input id="f_last">
    <label>ชื่อเล่น</label><input id="f_nick">
    <button onclick="doSearch()">ค้นหาข้อมูล</button>
  </div>
</div>

<script>
const LIFF_ID = '2009815147-aGgIrfPv';
const API = 'https://script.google.com/macros/s/AKfycbwE4Mp0w-xeFGksjw6sQsoqdDdVh78tO-EXGr_ULxHEzlQJBKa-TcRtV4oSpR4zkzPsHg/exec';
let idToken=null;

(async function init(){
  await liff.init({liffId:LIFF_ID});
  if(!liff.isLoggedIn()){ liff.login(); return; }
  idToken = liff.getIDToken();
  const res = await fetch(API, {method:'POST', body:JSON.stringify({action:'board', idToken})});
  const data = await res.json();
  render(data.list);
  if(!data.bound) document.getElementById('mask').className = 'mask on';
})();

function render(list){
  document.getElementById('list').innerHTML = list.map((u,i) => `
    <div class="row">
      <div class="main" onclick="toggle(${i})">
        <div>#${u.rank}</div>
        <div style="flex:1"><b>${u.name}</b><br><small>${u.nick||''}</small></div>
        <div class="pts">${u.score} pts</div>
      </div>
      <div class="details" id="d${i}">
        <small>Collaboration:</small>
        <div class="dots">${u.collab.map(c => `<div class="dot ${c.on?'on':''}"></div>`).join('')}</div>
        <small>Ownership:</small>
        <div class="dots">${u.owner.map(o => `<div class="dot green ${o.on?'on':''}"></div>`).join('')}</div>
      </div>
    </div>`).join('');
}

function toggle(i){ const d=document.getElementById('d'+i); d.style.display = d.style.display==='block' ? 'none' : 'block'; }

async function doSearch(){
  const p = {action:'search', firstName:document.getElementById('f_first').value, lastName:document.getElementById('f_last').value};
  const res = await fetch(API, {method:'POST', body:JSON.stringify(p)});
  const data = await res.json();
  // หลังค้นหาเจอ ควรเพิ่ม Logic การเลือกรายชื่อเหมือนเดิมนะครับ
  alert("พบข้อมูล: " + data.candidates.length + " รายการ");
}
</script>
</body>
</html>
