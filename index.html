<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOCUS 360</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--bg:#f8f9fe; --blue:#2563eb; --card:#ffffff; --tx:#1e293b;}
body{background:var(--bg); font-family:sans-serif; color:var(--tx); margin:0; padding:20px;}
.profile-card{background:var(--card); padding:20px; border-radius:24px; display:flex; align-items:center; gap:15px; margin-bottom:20px; box-shadow:0 4px 6px rgba(0,0,0,0.05);}
.avatar{width:60px; height:60px; border-radius:50%; object-fit:cover; border:3px solid var(--blue);}
.avatar-option{flex:0 0 65px; width:65px; height:65px; border-radius:50%; cursor:pointer; border:3px solid transparent; object-fit:cover; background:#ddd;}
.avatar-option.selected{border-color:var(--blue); transform:scale(1.1);}
</style>
</head>
<body>

<div class="profile-card">
  <img id="my-avatar" src="" class="avatar">
  <div>
    <div id="my-name" style="font-weight:700">ยินดีต้อนรับ</div>
  </div>
</div>

<div id="mask" style="position:fixed; inset:0; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; z-index:999;">
  <div style="background:white; padding:20px; border-radius:20px; width:85%; text-align:center;">
    <h3>เลือกตัวละคร</h3>
    <div id="profile-picker" style="display:flex; overflow-x:auto; gap:10px; padding:10px 0; margin-bottom:20px;">
        <!-- ใช้ตัวอักษรย่อแทนรูปชั่วคราว เพื่อทดสอบการโหลด -->
        <div class="avatar-option" onclick="selectAvatar('Flash', this)" style="display:flex; align-items:center; justify-content:center; background:#ffcccb;">F</div>
        <div class="avatar-option" onclick="selectAvatar('Bellwether', this)" style="display:flex; align-items:center; justify-content:center; background:#ccffcc;">B</div>
        <div class="avatar-option" onclick="selectAvatar('Gazelle', this)" style="display:flex; align-items:center; justify-content:center; background:#ccccff;">G</div>
        <div class="avatar-option" onclick="selectAvatar('Nick', this)" style="display:flex; align-items:center; justify-content:center; background:#ffffcc;">N</div>
        <div class="avatar-option" onclick="selectAvatar('Judy', this)" style="display:flex; align-items:center; justify-content:center; background:#ffccff;">J</div>
    </div>
    <input id="f_first" placeholder="ชื่อ" style="width:90%; padding:10px; margin-bottom:10px;"><br>
    <button onclick="doBind()" style="width:95%; padding:15px; background:var(--blue); color:white; border:none; border-radius:10px;">ตกลง</button>
  </div>
</div>

<script>
let selectedAvatar = 'Flash';
function selectAvatar(name, el) {
  document.querySelectorAll('.avatar-option').forEach(i => i.classList.remove('selected'));
  el.classList.add('selected');
  selectedAvatar = name;
}
// ... ส่วนของ init และ doBind ให้คงเดิมตาม Script ของคุณ ...
</script>
</body>
</html>
