<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Collection Badge Leaderboard</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --blue:#1a6ff0; --blue2:#0d5ae0; --green:#16a34a;
  --bg:#f2f7fd; --tx:#1f2a44; --mut:#8a94a6; --orange:#f97316;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);
     font-family:-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;padding-bottom:28px}

/* ---------- HEADER ---------- */
.hd{position:relative;background:linear-gradient(135deg,#2b8cff,#0d5ae0);
    padding:34px 20px 54px;text-align:center;overflow:hidden;
    border-radius:0 0 46% 46%/0 0 22% 22%}
.hd h1{margin:0;font-size:30px;font-weight:900;color:#fff;letter-spacing:1.4px;
       line-height:1.1;text-shadow:0 3px 10px rgba(0,0,0,.18)}
.hd .sub{display:inline-block;margin-top:12px;padding:7px 26px;border-radius:999px;
         background:rgba(255,255,255,.22);color:#fff;font-weight:800;
         font-size:14px;letter-spacing:3px;border:1px solid rgba(255,255,255,.35)}
.hd .lau{position:absolute;top:26px;font-size:40px;opacity:.95}
.hd .l1{left:22px}.hd .l2{right:22px;transform:scaleX(-1)}
.dot-bg{position:absolute;border-radius:50%;opacity:.5}

/* ---------- STICKY ME BAR ---------- */
.mebar{position:sticky;top:0;z-index:50;margin:-26px 12px 4px;
       background:linear-gradient(100deg,#0d5ae0,#2b8cff);color:#fff;
       border-radius:18px;padding:11px 14px;display:none;align-items:center;gap:10px;
       box-shadow:0 8px 22px rgba(13,90,224,.34);
       border:2px solid rgba(255,255,255,.35);cursor:pointer;
       transition:opacity .25s, transform .25s}
.mebar.show{display:flex}
.mebar.dim{opacity:0;transform:translateY(-8px);pointer-events:none}
.mebar .rk{min-width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
           background:rgba(255,255,255,.22);font-weight:900;font-size:17px;
           border:1.5px solid rgba(255,255,255,.4)}
.mebar .ava{width:38px;min-width:38px;height:38px;border-radius:50%;
            display:grid;place-items:center;font-weight:800;font-size:17px;
            background:#fff;color:#0d5ae0}
.mebar .info{flex:1;min-width:0}
.mebar .info b{display:block;font-size:14.5px;font-weight:800;
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mebar .info small{font-size:11px;opacity:.85;font-weight:600}
.mebar .mini{display:flex;gap:4px;margin-top:4px}
.mebar .mini i{width:9px;height:9px;border-radius:50%;
               border:1.5px solid rgba(255,255,255,.75);display:block}
.mebar .mini i.on{background:#fff}
.mebar .mini i.sp{margin-left:5px}
.mebar .pt{text-align:center;min-width:50px;padding-left:10px;
           border-left:1px solid rgba(255,255,255,.3)}
.mebar .pt b{display:block;font-size:26px;font-weight:900;line-height:1}
.mebar .pt small{font-size:9.5px;opacity:.85;font-weight:700}
.mebar.nb{background:linear-gradient(100deg,#f97316,#fb923c);justify-content:center;
          font-weight:800;font-size:14px}

/* ---------- ROW ---------- */
.wrap{padding:14px 14px 0}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;
     padding:14px;margin-bottom:12px;box-shadow:0 3px 14px rgba(20,60,120,.07)}
.row.t1{background:linear-gradient(100deg,#fff9e6,#fff);border:2px solid #ffd869}
.row.t2{background:linear-gradient(100deg,#eef2f7,#fff);border:2px solid #d7dee8}
.row.t3{background:linear-gradient(100deg,#fff2e6,#fff);border:2px solid #ffcb9a}
.row.me{outline:2.5px dashed var(--green);outline-offset:2px}

.medal{width:44px;min-width:44px;height:44px;border-radius:50%;display:grid;
       place-items:center;font-weight:900;font-size:19px;color:#fff;
       box-shadow:0 3px 8px rgba(0,0,0,.18)}
.m1{background:linear-gradient(160deg,#ffd95e,#e8a200)}
.m2{background:linear-gradient(160deg,#dfe6ee,#9aa8b8)}
.m3{background:linear-gradient(160deg,#f0a56a,#c16a2b)}
.mn{background:none;box-shadow:none;color:#94a3b8;font-size:26px}

.av{width:50px;min-width:50px;height:50px;border-radius:50%;display:grid;place-items:center;
    color:#fff;font-weight:800;font-size:22px;box-shadow:0 3px 8px rgba(0,0,0,.14)}

.nm{flex:1;min-width:0}
.nm b{display:block;font-size:16px;font-weight:800;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--mut);font-size:12.5px;font-weight:600}
.mechip{display:inline-block;background:var(--green);color:#fff;font-size:10px;
        font-weight:800;padding:2px 7px;border-radius:999px;margin-left:5px}

.grp{text-align:center;padding:0 8px;border-left:1px solid #eef1f5}
.grp .tt{font-size:11.5px;font-weight:800;margin-bottom:6px;white-space:nowrap}
.grp.c .tt{color:var(--blue)} .grp.o .tt{color:var(--green)}
.dots{display:flex;gap:7px;justify-content:center}
.d{width:15px;height:15px;border-radius:50%;border:2px solid}
.d.c{border-color:var(--blue)} .d.c.on{background:var(--blue)}
.d.o{border-color:var(--green)} .d.o.on{background:var(--green)}
.lbs{display:flex;gap:7px;justify-content:center;margin-top:3px}
.lbs span{width:15px;font-size:8.5px;color:var(--mut);font-weight:700;text-align:center}

.sc{text-align:center;min-width:60px;padding-left:8px;border-left:1px solid #eef1f5}
.sc .tt{font-size:9.5px;font-weight:800;color:var(--mut);letter-spacing:.4px}
.sc .v{font-size:34px;font-weight:900;line-height:1.05;color:var(--blue)}
.row.t1 .sc .v,.row.t3 .sc .v{color:var(--orange)}
.sc .u{font-size:10.5px;color:var(--mut);font-weight:600}

/* ---------- LEGEND ---------- */
.lg{margin:16px auto 0;background:#fff;border-radius:999px;padding:11px 20px;
    width:max-content;max-width:94%;box-shadow:0 3px 12px rgba(20,60,120,.07);
    display:none;gap:16px;align-items:center;font-size:12.5px;font-weight:600;
    flex-wrap:wrap;justify-content:center}
.lg i{width:14px;height:14px;border-radius:50%;border:2px solid var(--blue);
      display:inline-block;vertical-align:-2px;margin-right:5px}
.lg i.f{background:var(--blue)}

/* ---------- MODAL ---------- */
.mask{position:fixed;inset:0;background:rgba(10,25,50,.55);display:none;
      align-items:center;justify-content:center;padding:18px;z-index:99}
.mask.on{display:flex}
.modal{background:#fff;border-radius:22px;padding:24px;width:100%;max-width:400px;
       max-height:88vh;overflow:auto}
.modal h2{margin:0 0 4px;font-size:19px}
.modal p.s{margin:0 0 14px;font-size:13px;color:var(--mut)}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
input{width:100%;padding:12px;border:1.5px solid #dfe4ec;border-radius:12px;
      font-size:16px;font-family:inherit;outline:none}
input:focus{border-color:var(--blue)}
button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--blue);
       color:#fff;font-size:16px;font-weight:800;margin-top:16px;font-family:inherit}
button:disabled{background:#c9d0da}
.gh{background:#eef1f5;color:#41506b}
.cand{border:1.5px solid #e6eaf0;border-radius:14px;padding:12px;margin-top:8px}
.cand.sel{border-color:var(--blue);background:#eef5ff}
.cand b{display:block;font-size:15px}.cand small{color:var(--mut)}
.err{color:#dc2626;font-size:13px;margin-top:9px;min-height:17px}
.center{text-align:center;padding:60px 16px;color:var(--mut)}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<div class="hd">
  <div class="lau l1">🌿</div><div class="lau l2">🌿</div>
  <span class="dot-bg" style="width:16px;height:16px;background:#ffd85e;top:18px;left:30%"></span>
  <span class="dot-bg" style="width:11px;height:11px;background:#fff;top:60px;left:14%"></span>
  <span class="dot-bg" style="width:13px;height:13px;background:#8ed0ff;top:34px;right:26%"></span>
  <div style="font-size:26px;margin-bottom:2px">⭐</div>
  <h1>COLLECTION BADGE</h1>
  <div class="sub">LEADERBOARD</div>
</div>

<!-- ===== STICKY ME BAR ===== -->
<div class="mebar" id="mebar"></div>

<div id="loading" class="center">⏳ กำลังโหลดอันดับ...</div>
<div class="wrap" id="list"></div>

<div class="lg" id="legend">
  💡 <span><i class="f"></i>จุดทึบ = มีคะแนน</span>
  <span><i></i>จุดโปร่ง = ไม่มีคะแนน</span>
</div>

<!-- ===== POPUP ผูกบัญชี ===== -->
<div class="mask" id="mask">
  <div class="modal">
    <div id="s1">
      <h2>ยืนยันตัวตน</h2>
      <p class="s">กรอกข้อมูลให้ตรงกับที่ลงทะเบียนไว้ เพื่อผูกกับบัญชี LINE ของคุณ</p>
      <label>ชื่อจริง *</label><input id="f_first" placeholder="เช่น โกสินทร์">
      <label>ชื่อเล่น</label><input id="f_nick" placeholder="เช่น โก้">
      <label>นามสกุล *</label><input id="f_last" placeholder="เช่น ใจดี">
      <div class="err" id="e1"></div>
      <button id="btn1" onclick="doSearch()">ค้นหาข้อมูลของฉัน</button>
    </div>
    <div id="s2" style="display:none">
      <h2>เลือกรายชื่อของคุณ</h2>
      <p class="s">แตะเลือกรายการที่ตรงกับคุณ แล้วกดยืนยัน</p>
      <div id="cands"></div><div class="err" id="e2"></div>
      <button id="btn2" onclick="doBind()" disabled>ยืนยันและผูกบัญชี</button>
      <button class="gh" onclick="back()">ย้อนกลับ</button>
    </div>
  </div>
</div>

<script>
/* ================= CONFIG ================= */
const LIFF_ID = '2000000000-xxxxxxxx';                              // 👈 ใส่ LIFF ID
const API     = 'https://script.google.com/macros/s/AKfycb.../exec'; // 👈 ใส่ Web App URL
/* ========================================== */

const AV = ['#f5a623','#9aa3ae','#f4762a','#8b3dff','#12a594','#1a8cff',
            '#e2456b','#0ea5e9','#65a30d','#d946ef'];
let idToken = null, profile = null, picked = null, meObserver = null;
const $ = id => document.getElementById(id);

async function api(p){
  const r = await fetch(API, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ ...p, idToken })
  });
  const j = await r.json();
  if(!j.ok) throw new Error(j.error);
  return j;
}

/* ---------- INIT ---------- */
(async function init(){
  try{
    await liff.init({ liffId: LIFF_ID });
    if(!liff.isLoggedIn()){ liff.login(); return; }

    profile = await liff.getProfile();
    idToken = liff.getIDToken();

    const b = await api({ action:'board' });
    $('loading').style.display = 'none';
    render(b.list, b.bound);
    if(!b.bound) $('mask').classList.add('on');
  }catch(e){
    $('loading').innerHTML = '❌ ' + e.message;
  }
})();

/* ---------- RENDER ---------- */
function dotSet(arr, cls){
  return `<div class="dots">${arr.map(d=>`<div class="d ${cls}${d.on?' on':''}"></div>`).join('')}</div>
          <div class="lbs">${arr.map(d=>`<span>${d.label}</span>`).join('')}</div>`;
}

function render(list, bound){
  $('list').innerHTML = list.map((u,i)=>{
    const r = u.rank, t = r<=3 ? ' t'+r : '';
    const medal = r<=3 ? `<div class="medal m${r}">${r}</div>`
                       : `<div class="medal mn">${r}</div>`;
    const cOn = u.collab.filter(x=>x.on).length;
    const oOn = u.owner.filter(x=>x.on).length;
    return `
    <div class="row${t}${u.isMe?' me':''}">
      ${medal}
      <div class="av" style="background:${AV[i%AV.length]}">${u.name.charAt(0)}</div>
      <div class="nm">
        <b>${u.name}${u.isMe?'<span class="mechip">คุณ</span>':''}</b>
        <small>#${r}${u.nick?' · '+u.nick:''}</small>
      </div>
      <div class="grp c">
        <div class="tt">Collaboration (${cOn}/${u.collab.length})</div>
        ${dotSet(u.collab,'c')}
      </div>
      <div class="grp o">
        <div class="tt">Ownership (${oOn}/${u.owner.length})</div>
        ${dotSet(u.owner,'o')}
      </div>
      <div class="sc">
        <div class="tt">TOTAL SCORE</div>
        <div class="v">${u.score}</div>
        <div class="u">Points</div>
      </div>
    </div>`;
  }).join('');

  $('legend').style.display = 'flex';
  renderMeBar(list, bound);
}

function renderMeBar(list, bound){
  const bar = $('mebar');

  if(!bound){
    bar.className = 'mebar nb show';
    bar.innerHTML = '🔗 แตะเพื่อผูกบัญชีและดูอันดับของคุณ';
    bar.onclick = () => $('mask').classList.add('on');
    return;
  }

  const u = list.find(x => x.isMe);
  if(!u){ bar.className = 'mebar'; return; }

  const mini = [
    ...u.collab.map(d => `<i class="${d.on?'on':''}"></i>`),
    ...u.owner.map((d,i) => `<i class="${d.on?'on':''}${i===0?' sp':''}"></i>`)
  ].join('');

  bar.className = 'mebar show';
  bar.innerHTML = `
    <div class="rk">${u.rank<=3 ? ['🥇','🥈','🥉'][u.rank-1] : '#'+u.rank}</div>
    <div class="ava">${u.name.charAt(0)}</div>
    <div class="info">
      <b>${u.name}</b>
      <small>อันดับที่ ${u.rank} จาก ${list.length} คน</small>
      <div class="mini">${mini}</div>
    </div>
    <div class="pt"><b>${u.score}</b><small>POINTS</small></div>`;

  bar.onclick = () => document.querySelector('.row.me')
                        ?.scrollIntoView({behavior:'smooth',block:'center'});

  meObserver?.disconnect();
  const myRow = document.querySelector('.row.me');
  if(myRow && 'IntersectionObserver' in window){
    meObserver = new IntersectionObserver(
      ([e]) => bar.classList.toggle('dim', e.isIntersecting),
      { rootMargin:'-90px 0px -30% 0px', threshold:0.6 }
    );
    meObserver.observe(myRow);
  }
}

/* ---------- BINDING FLOW ---------- */
async function doSearch(){
  const f=$('f_first').value.trim(), l=$('f_last').value.trim(), n=$('f_nick').value.trim();
  if(!f||!l){ $('e1').textContent='กรุณากรอกชื่อจริงและนามสกุล'; return; }

  $('btn1').disabled=true; $('btn1').textContent='กำลังค้นหา...'; $('e1').textContent='';
  try{
    const r = await api({ action:'search', firstName:f, lastName:l, nickName:n });
    if(!r.candidates.length){
      $('e1').textContent='ไม่พบข้อมูล กรุณาตรวจสอบการสะกด หรือติดต่อแอดมิน';
    }else{
      window._c = r.candidates;
      $('cands').innerHTML = r.candidates.map((c,i)=>
        `<div class="cand" onclick="pick(${i},this)">
           <b>${c.fullName||'-'}</b>
           <small>ชื่อเล่น: ${c.nickName||'-'} · ${c.points} คะแนน</small>
         </div>`).join('');
      $('s1').style.display='none'; $('s2').style.display='block';
    }
  }catch(e){ $('e1').textContent = e.message; }
  $('btn1').disabled=false; $('btn1').textContent='ค้นหาข้อมูลของฉัน';
}

function pick(i, el){
  document.querySelectorAll('.cand').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');
  picked = window._c[i];
  $('btn2').disabled = false;
}

function back(){
  $('s2').style.display='none';
  $('s1').style.display='block';
  picked = null;
}

async function doBind(){
  $('btn2').disabled=true; $('btn2').textContent='กำลังบันทึก...'; $('e2').textContent='';
  try{
    await api({
      action:'bind', matchKey: picked.matchKey,
      displayName: profile.displayName,
      firstName: $('f_first').value.trim(),
      nickName : $('f_nick').value.trim(),
      lastName : $('f_last').value.trim()
    });
    $('mask').classList.remove('on');
    const b = await api({ action:'board' });
    render(b.list, b.bound);
  }catch(e){
    $('e2').textContent = e.message;
    $('btn2').disabled=false; $('btn2').textContent='ยืนยันและผูกบัญชี';
  }
}
</script>
</body>
</html>
